name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

# Least privilege: the workflow only reads the repository. No secrets, no pull_request_target,
# no deployment, no cloud credentials. Synthetic data only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  CUSPATLAS_ENV: synthetic-test

jobs:
  verify:
    name: verify (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned by full commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # pnpm version comes from "packageManager" in package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x # package.json engines: >=24.13 <25
          cache: pnpm # keyed on pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm contract:check
      - name: test (unit + integration against embedded PostgreSQL, synthetic only)
        run: pnpm test -- --reporter=default --reporter=json --outputFile.json="${{ runner.temp }}/vitest-raw.json"
      - name: reduce test report to counts and file status (no test titles)
        run: node scripts/test-summary.mjs "${{ runner.temp }}/vitest-raw.json" artifacts/test-summary.json
      - run: pnpm scan:privacy
      - run: pnpm sbom
      - name: evidence manifest (AS-01..AS-04; per-run integrity signature proves tamper-evidence only, not origin; unreviewed, not certified)
        run: pnpm evidence
      - run: pnpm evidence-verify
      - name: scan generated artifacts for the synthetic marker
        # The scanner checks arguments with no allowlist, so the marker (defined only in allowlisted
        # sources) fails the job if it appears anywhere in the artifact set.
        run: node scripts/privacy-scan.mjs artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-evidence
          path: |
            artifacts/sbom.cdx.json
            artifacts/evidence-manifest.json
            artifacts/evidence-manifest.sig
            artifacts/evidence-signing.pub
            artifacts/test-summary.json
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    name: windows-smoke (install, typecheck, unit, integration)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test -- --project unit
      # Embedded PostgreSQL refuses to run postgres.exe under the runner's administrator account, so the
      # integration global setup starts the server through the bundled pg_ctl on Windows (restricted
      # token). The diagnostic below stays as a non-blocking record of the raw binaries.
      - name: embedded PostgreSQL binaries diagnostic (non-blocking)
        continue-on-error: true
        shell: bash
        run: node scripts/pg-diagnostic.mjs "$RUNNER_TEMP/pg-diagnostic.log"
      - name: integration tests against embedded PostgreSQL via pg_ctl (synthetic only)
        shell: bash
        env:
          CUSPATLAS_PG_DIAG_FILE: ${{ runner.temp }}/pg-global-setup.log
        run: pnpm test -- --project integration 2>&1 | tee "$RUNNER_TEMP/pg-integration.log"; exit "${PIPESTATUS[0]}"
      - name: print embedded PostgreSQL diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          for f in pg-diagnostic.log pg-global-setup.log pg-integration.log; do
            echo "===== $f ====="
            cat "$RUNNER_TEMP/$f" 2>/dev/null || echo "(not written)"
          done
