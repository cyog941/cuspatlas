      description: >-
        Compare two exams of one patient (C7) per tooth and site for probing depth and recession: only measured pairs carry a delta (target minus base); not_measured and absent sites are listed with the reason and never treated as improvement. With formulaRef and formulaVersion, the latest derivation of that version in each exam is compared too and each exam's formula version is named (pending approval; 409 derivation_missing when an exam has none). Exams of different patients are 422 examPatientMismatch. A sensitive read. Requires clinical.read.
      parameters:
        - $ref: '#/components/parameters/PerioBaseExam'
        - $ref: '#/components/parameters/PerioTargetExam'
        - $ref: '#/components/parameters/PerioFormulaRefQuery'
        - $ref: '#/components/parameters/PerioFormulaVersionQuery'
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/PerioComparison'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans:
    post:
      operationId: clinical.treatmentPlans.create
      description: >-
        Create a treatment plan (C11) for a patient with its first draft version (revision 1). No level of a plan stores an amount. With an encounterRef the encounter must be open. A merged-away patient is 409 patient_merged. Requires clinical.write and a resolvable clinical author.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanCreate'
      responses:
        '201':
          description: Plan created (targetRef is the plan).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans/{planRef}:
    get:
      operationId: clinical.treatmentPlans.read
      description: >-
        One treatment plan (C11) at all three levels: every version (draft, accepted or superseded, with the version it supersedes and its successor), its details (scope, tooth, surfaces, area, chart entry, state) and their items (provisional SYN- procedure code, sequence, fee schedule reference, chart entry, state, appointment reference and every transition with cause and author), plus estimate readiness (whether every item names a fee schedule reference; never an amount). A sensitive read. Requires clinical.read.
      parameters:
        - $ref: '#/components/parameters/TreatmentPlanRef'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanRead'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/patients/{patientRef}/treatment-plans:
    get:
      operationId: clinical.treatmentPlans.list
      description: >-
        A patient's treatment plans (C11) with their head version and its state, each with its source patient. A merged-away patient is 409 patient_merged. A sensitive read. Requires clinical.read.
      parameters:
        - $ref: '#/components/parameters/PatientRef'
      responses:
        '200':
          description: The plans.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanList'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans/versions/{planVersionRef}/details:
    post:
      operationId: clinical.treatmentPlans.addDetail
      description: >-
        Add a detail (C11) to a draft plan version if expectedRevision matches (409 stale_version otherwise): scope tooth (tooth), surface_set (tooth and surfaces validated per tooth type), area (provisional area code) or whole_mouth. A tooth must name its chart entry (same patient, current; a tooth charted missing is plannable only this way) or have an active chart state (409 tooth_not_charted); nothing is charted implicitly. An accepted version is 409 plan_version_accepted; a superseded one 409 plan_version_superseded naming its successor. Requires clinical.write and a resolvable clinical author.
      parameters:
        - $ref: '#/components/parameters/PlanVersionRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/PlanDetailAdd'
      responses:
        '201':
          description: Detail added (targetRef is the detail).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans/details/{planDetailRef}/items:
    post:
      operationId: clinical.treatmentPlans.addItem
      description: >-
        Add an item (C11) to an active detail of a draft version if expectedRevision matches: a provisional SYN- procedure code, a sequence, an optional tooth (inside the detail's tooth), surfaces or area, an optional fee schedule reference and chart entry. An item never carries an amount; without a fee schedule reference it is estimate-incomplete. Its first state is proposed. Requires clinical.write and a resolvable clinical author.
      parameters:
        - $ref: '#/components/parameters/PlanDetailRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/PlanItemAdd'
      responses:
        '201':
          description: Item added (targetRef is the item).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans/items/{planItemRef}/state:
    post:
      operationId: clinical.treatmentPlans.setItemState
      description: >-
        Move an item (C11) through the designed transition set if expectedRevision matches: proposed to accepted, declined or discontinued; accepted to scheduled (a booked appointment of the same patient, referenced only; no scheduling record is written), declined or discontinued; scheduled to accepted (with a reason), declined or discontinued; declined to proposed (with a reason). Anything else is 409 transition_not_allowed; completed is 409 completion_requires_rendered_procedure naming clinical.procedures.render (C14). Allowed on an accepted version, refused on a superseded one or a declined or discontinued detail. Requires clinical.write and a resolvable clinical author.
      parameters:
        - $ref: '#/components/parameters/PlanItemRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/PlanItemStateSet'
      responses:
        '200':
          description: Transition recorded (targetRef is the item).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans/details/{planDetailRef}/state:
    post:
      operationId: clinical.treatmentPlans.setDetailState
      description: >-
        Decline or discontinue an active detail (C11) with a reason if expectedRevision matches. Each item still proposed, accepted or scheduled receives its own recorded transition to the same state, naming the detail as parent and carrying the reason; items already declined or discontinued are left as they are. There is no delete. Requires clinical.write and a resolvable clinical author.
      parameters:
        - $ref: '#/components/parameters/PlanDetailRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/PlanDetailStateSet'
      responses:
        '200':
          description: Detail state and consequences recorded (targetRef is the detail).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans/versions/{planVersionRef}/supersede:
    post:
      operationId: clinical.treatmentPlans.supersede
      description: >-
        Create the next plan version (C11) naming the head version it supersedes, with a reason; its details and items are carried forward with their current states (recorded as carried_forward) and derivation links. The superseded version, accepted or not, stays readable and unchanged; it takes no further edit. Requires clinical.write and a resolvable clinical author.
      parameters:
        - $ref: '#/components/parameters/PlanVersionRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/PlanVersionSupersede'
      responses:
        '201':
          description: New version created (targetRef is the new version).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans/versions/{planVersionRef}/estimates:
    post:
      operationId: clinical.estimates.generate
      description: >-
        Generate the next immutable estimate version (C12) of a plan version from staff-entered per-item fee placeholders as Money (each for an item naming a fee schedule reference; synthetic, no fee schedule data until B9) and coverage or discount references with source freshness (B5 owns eligibility; nothing is computed here). An estimate missing a fee for any open item is incomplete and carries no amount. Never a coverage guarantee (notAGuarantee, coverageStatus entered, unknown or stale; patient responsibility is a labelled unknown or a bounded range, C-D7 recommended-pending-approval). Requires clinical.write (human).
      parameters:
        - $ref: '#/components/parameters/PlanVersionRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EstimateGenerate'
      responses:
        '201':
          description: Estimate version created.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EstimateCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
    get:
      operationId: clinical.estimates.list
      description: >-
        Every estimate version of a plan version (C12), oldest first, with presentation and acceptance. A sensitive read. Requires clinical.read.
      parameters:
        - $ref: '#/components/parameters/PlanVersionRef'
      responses:
        '200':
          description: The estimates.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EstimateList'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/estimates/{estimateRef}:
    get:
      operationId: clinical.estimates.read
      description: >-
        One estimate version (C12) with lines, assumptions, coverage status, presentation, acceptance and the consent binding (outstanding until C13 binds a consent). A sensitive read. Requires clinical.read.
      parameters:
        - $ref: '#/components/parameters/EstimateRef'
      responses:
        '200':
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EstimateRead'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/estimates/{estimateRef}/presentation:
    post:
      operationId: clinical.estimates.present
      description: >-
        Mark the current complete estimate as presented (C12), re-evaluating coverage freshness at that instant (stale is shown, never silently reused). A superseded estimate is 409 estimate_superseded naming the current version; an incomplete one is 409 estimate_incomplete. Requires clinical.write (human).
      parameters:
        - $ref: '#/components/parameters/EstimateRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EstimatePresent'
      responses:
        '200':
          description: Estimate presented.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EstimateCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/estimates/{estimateRef}/acceptance:
    post:
      operationId: clinical.estimates.accept
      description: >-
        Accept the plan version against this exact current estimate (C12) through the C11 acceptance seam (expectedRevision of the plan version). Full scope only: a phase-level acceptance is 409 partial_acceptance_unsupported. A superseded estimate is 409 estimate_superseded; an already accepted version or an accepted alternative of the same problem is 409. The acceptance records an outstanding consent binding; it is never consented treatment by itself (C13). Requires clinical.write (human).
      parameters:
        - $ref: '#/components/parameters/EstimateRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EstimateAccept'
      responses:
        '201':
          description: Acceptance recorded.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EstimateCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/clinical/treatment-plans/{planRef}/alternatives:
    post:
      operationId: clinical.treatmentPlans.createAlternative
      description: >-
        Create an alternative plan (C12) for the same patient and clinical problem; both plans join one alternative group and the source plan is never changed. Requires clinical.write and a resolvable clinical author.
      parameters:
        - $ref: '#/components/parameters/TreatmentPlanRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/PlanAlternativeCreate'
      responses:
        '201':
          description: Alternative plan created (targetRef is the new plan).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/TreatmentPlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
    get:
      operationId: clinical.treatmentPlans.alternatives
      description: >-
        The plans offered for the same problem (C12), oldest first, with head version, state and selection (accepted, unselected, undecided). A sensitive read. Requires clinical.read.
      parameters:
        - $ref: '#/components/parameters/TreatmentPlanRef'
      responses:
        '200':
          description: The alternatives.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/PlanAlternativeList'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA; claims sub, tid, sid, iss, aud, exp, iat)
  parameters:
    TaskRef:
      name: taskRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/TaskRef'
    ProposalRef:
      name: proposalRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalRef'
    PatientRef:
      name: patientRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/PatientRef'
    RelationshipRef:
      name: relationshipRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/RelationshipRef'
    MergeRef:
      name: mergeRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/MergeRef'
    RequestRef:
      name: requestRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/RequestRef'
    AppointmentRef:
      name: appointmentRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/AppointmentRef'
    HoldRef:
      name: holdRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/HoldRef'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-supplied key, scoped to (tenant, principal, operation) and retained 7 days. A retry with
        the same key and an identical body (canonical SHA-256 digest; key order ignored) returns the
        recorded result with replayed=true after re-authorizing the caller, or replays the recorded
        terminal refusal (for example stale_version). The same key with a different body (or another
        relabel target) is 409 idempotency_conflict. While the first request is still in flight a
        duplicate waits for it; a reservation left pending for more than 60 s is taken over. A
        corrected request needs a new key.
      schema:
        $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/IdempotencyKey'
    ResourceRef:
      name: resourceRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceRefId'
    SchedulingLocationRef:
      name: locationRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationRef'
    ResourceListLocation:
      name: locationRef
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationRef'
    ResourceListKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceKind'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size 1-100 (default 25). Larger values are refused, not clamped.
      schema:
        type: string
        pattern: '^([1-9]|[1-9][0-9]|100)$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/Cursor'
    EncounterRef:
      name: encounterRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/EncounterRef'
    ClinicalCursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/Cursor'
    HistoryVersionRef:
      name: historyVersionRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/HistoryVersionRef'
    HistoryItemRef:
      name: itemRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/HistoryItemRef'
    HistoryAsOf:
      name: asOf
      in: query
      required: false
      description: RFC 3339 instant; the history as recorded at that instant (default now).
      schema:
        $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/Instant'
    NoteTemplateRef:
      name: templateRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/NoteTemplateRef'
    NoteTemplateVersionRef:
      name: templateVersionRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/NoteTemplateVersionRef'
    NoteTemplateProcedureCodes:
      name: procedureCodeRefs
      in: query
      required: false
      description: Comma-separated synthetic SYN- procedure codes proposed or rendered at the encounter.
      schema:
        $ref: '../../packages/contracts/src/clinical.schema.json#/$defs/NoteTemplateApplicableQuery/properties/procedureCodeRefs'
    NoteRef:
      name: noteRef
      in: path
      required: true
      schema:
