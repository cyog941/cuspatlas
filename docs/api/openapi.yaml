          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/payment-plans/{planRef}:
    get:
      operationId: billing.plans.read
      description: >-
        A derived plan view: terms history, schedule, collected, balance, overdue, next due date, authorization, auto-pay and card-expiry state, attempts and facts. Nothing in it is stored. Requires receivables.read.
      parameters:
        - $ref: '#/components/parameters/PlanRef'
      responses:
        '200':
          description: The derived plan view.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanRead'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/payment-plans/{planRef}/authorizations:
    post:
      operationId: billing.plans.authorize
      description: >-
        Record the signed-agreement authorization fact (synthetic authorization and evidence references, each used once per plan) for the current terms. 409 already_authorized, plan_closed or stale_version. Requires billing.write.
      parameters:
        - $ref: '#/components/parameters/PlanRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanAuthorize'
      responses:
        '201':
          description: The authorization fact.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/payment-plans/{planRef}/amendments:
    post:
      operationId: billing.plans.amend
      description: >-
        Amend the plan as a new terms version; collected money becomes the basis of the new schedule and the new terms are unsigned until authorized. 422 amendment_below_collected; 409 attempt_in_flight, plan_closed or stale_version. Requires billing.write.
      parameters:
        - $ref: '#/components/parameters/PlanRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanAmend'
      responses:
        '201':
          description: The new terms version.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/payment-plans/{planRef}/autopay:
    post:
      operationId: billing.plans.autopay
      description: >-
        Enroll auto-pay with a synthetic instrument, card expiry month and a new authorization record (a reused one is 409 authorization_reused), or pause or resume it. 409 unsigned_authorization or instrument_absent; 422 instrument_incomplete. Requires billing.write.
      parameters:
        - $ref: '#/components/parameters/PlanRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanAutopay'
      responses:
        '201':
          description: The auto-pay fact.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/payment-plans/{planRef}/collections:
    post:
      operationId: billing.plans.collect
      description: >-
        Attempt one due installment period through the synthetic provider port (B-S1 blocked-on-discovery) with a key derived from the plan, terms version, period and attempt number. Declined and unknown outcomes and an expired card (blocked, no charge) are recorded attempts, not refusals. 409 duplicate_period (a further attempt needs retry), attempt_in_flight, unsigned_authorization, instrument_absent, autopay_paused, plan_voided, plan_defaulted or plan_completed; 422 period_not_found, period_not_due or amount_exceeds_installment. Requires billing.write.
      parameters:
        - $ref: '#/components/parameters/PlanRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanCollect'
      responses:
        '201':
          description: The recorded installment attempt.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanCollectResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/payment-plans/{planRef}/close:
    post:
      operationId: billing.plans.close
      description: >-
        Void or default the plan (a human decision with a reason). History and collected money stay. 409 plan_closed, attempt_in_flight or stale_version. Requires billing.correct (human only).
      parameters:
        - $ref: '#/components/parameters/PlanRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanClose'
      responses:
        '201':
          description: The closure fact.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/payment-plan-worklist:
    get:
      operationId: billing.plans.worklist
      description: >-
        Owned payment-plan work items (missing signature, expired or expiring card, failed auto-pay, overdue installments), one per plan and problem, each with owner, queue, reason, due time, suggested action and evidence. Derived at read time. Requires receivables.read.
      parameters:
        - $ref: '#/components/parameters/PlanWorklistKind'
        - $ref: '#/components/parameters/BillingWorklistLimit'
      responses:
        '200':
          description: Plan work items ordered by due time, with total and truncation.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanWorklist'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/statements:
    post:
      operationId: billing.statements.generate
      description: >-
        Generate a statement as one audited command (B4; synthetic data only; pending billing approval): a canonical snapshot of the guarantor accounts (its dependents through the current S5 guarantor relationship, plus its own unless another guarantor holds it, each by merge set) from the journal at the cutoff, with its sha256 digest. The row is never updated; a regeneration is a new version that supersedes the latest. Credit and zero totals are classified explicitly. Delivery is E7 (channel none). 422 cutoff_in_future, guarantor_unresolved or statement_too_large; 409 patient_merged. Requires billing.write.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/billing.schema.json#/$defs/StatementGenerate'
      responses:
        '201':
          description: The generated statement version.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/StatementCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/billing/statements/{statementRef}:
    get:
      operationId: billing.statements.read
      description: >-
        The stored snapshot with its digest check and freshness derived now (posted after cutoff, account membership changed, superseded); never restated. Requires receivables.read.
      parameters:
        - $ref: '#/components/parameters/StatementRef'
      responses:
        '200':
          description: The statement and its derived freshness.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/billing.schema.json#/$defs/StatementRead'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA; claims sub, tid, sid, iss, aud, exp, iat)
  parameters:
    StatementRef:
      name: statementRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/StatementRef'
    PlanRef:
      name: planRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanRef'
    PlanWorklistKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PlanWorklistKind'
    TaskRef:
      name: taskRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/TaskRef'
    ProposalRef:
      name: proposalRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalRef'
    PatientRef:
      name: patientRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/PatientRef'
    RelationshipRef:
      name: relationshipRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/RelationshipRef'
    MergeRef:
      name: mergeRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/MergeRef'
    RequestRef:
      name: requestRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/RequestRef'
    AppointmentRef:
      name: appointmentRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/AppointmentRef'
    HoldRef:
      name: holdRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/HoldRef'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-supplied key, scoped to (tenant, principal, operation) and retained 7 days. A retry with
        the same key and an identical body (canonical SHA-256 digest; key order ignored) returns the
        recorded result with replayed=true after re-authorizing the caller, or replays the recorded
        terminal refusal (for example stale_version). The same key with a different body (or another
        relabel target) is 409 idempotency_conflict. While the first request is still in flight a
        duplicate waits for it; a reservation left pending for more than 60 s is taken over. A
        corrected request needs a new key.
      schema:
        $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/IdempotencyKey'
    ResourceRef:
      name: resourceRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceRefId'
    SchedulingLocationRef:
      name: locationRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationRef'
    ResourceListLocation:
      name: locationRef
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationRef'
    ResourceListKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceKind'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size 1-100 (default 25). Larger values are refused, not clamped.
      schema:
        type: string
        pattern: '^([1-9]|[1-9][0-9]|100)$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/Cursor'
    ChargeRef:
      name: chargeRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/ChargeRef'
    EntryRef:
      name: entryRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/EntryRef'
    BillingCursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/Cursor'
    BillingCurrency:
      name: currency
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/CurrencyCode'
    BillingAsOf:
      name: asOf
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/Instant'
    PaymentRef:
      name: paymentRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/PaymentRef'
    AttemptRef:
      name: attemptRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/AttemptRef'
    BillingWorklistKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/billing.schema.json#/$defs/WorklistKind'
    BillingWorklistLimit:
      name: limit
      in: query
      required: false
      description: Page size 1-100 (default 50). Larger values are refused, not clamped.
      schema:
        type: string
        pattern: '^([1-9]|[1-9][0-9]|100)$'
  responses:
    Refusal:
      description: Typed refusal (code, retryable, correlationId, optional safe detail).
      content:
        application/json:
          schema:
            $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/Refusal'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    Session:
      type: object
      additionalProperties: false
      required: [tenantRef, principalRef, principal, scopes]
      properties:
        tenantRef:
          type: string
        principalRef:
          type: string
        principal:
          enum: [human, service]
        scopes:
          type: array
          items:
            type: string
