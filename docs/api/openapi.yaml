          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/imaging/deletion-requests/{deletionRef}/execute:
    post:
      operationId: imaging.deletions.execute
      description: >-
        Execute a deletion (re-evaluated now; a second person for any image ever associated with a patient):
        tombstone with audit and provenance kept, derived objects included, read grants revoked, bytes
        removed unless shared by another live object. Retrying reports the same outcome.
      parameters:
        - name: deletionRef
          in: path
          required: true
          schema:
            $ref: '../../packages/contracts/src/imaging.schema.json#/$defs/DeletionRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/imaging.schema.json#/$defs/DeletionExecute'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/imaging.schema.json#/$defs/DeletionExecuteResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  # --- end imaging ---
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA; claims sub, tid, sid, iss, aud, exp, iat)
  parameters:
    RecallTaskRef:
      name: recallTaskRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/RecallTaskRef'
    PolicyRef:
      name: policyRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/StandingPolicyRef'
    RecoveryRef:
      name: recoveryRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/RecoveryRef'
    OfferRef:
      name: offerRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/OfferRef'
    EntryRef:
      name: entryRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/EntryRef'
    IntentRef:
      name: intentRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/IntentRef'
    SeriesRef:
      name: seriesRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/SeriesRef'
    ItemRef:
      name: itemRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/VisitItemRef'
    TaskRef:
      name: taskRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/TaskRef'
    ProposalRef:
      name: proposalRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalRef'
    PatientRef:
      name: patientRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/PatientRef'
    RelationshipRef:
      name: relationshipRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/RelationshipRef'
    MergeRef:
      name: mergeRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/patient.schema.json#/$defs/MergeRef'
    RequestRef:
      name: requestRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/RequestRef'
    AppointmentRef:
      name: appointmentRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/AppointmentRef'
    HoldRef:
      name: holdRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/HoldRef'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-supplied key, scoped to (tenant, principal, operation) and retained 7 days. A retry with
        the same key and an identical body (canonical SHA-256 digest; key order ignored) returns the
        recorded result with replayed=true after re-authorizing the caller, or replays the recorded
        terminal refusal (for example stale_version). The same key with a different body (or another
        relabel target) is 409 idempotency_conflict. While the first request is still in flight a
        duplicate waits for it; a reservation left pending for more than 60 s is taken over. A
        corrected request needs a new key.
      schema:
        $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/IdempotencyKey'
    ResourceRef:
      name: resourceRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceRefId'
    SchedulingLocationRef:
      name: locationRef
