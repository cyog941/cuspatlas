openapi: 3.1.0
info:
  title: CuspAtlas synthetic foundation API
  version: 0.1.0-synthetic
  summary: Non-clinical synthetic task domain used only to prove platform guarantees.
  description: |
    Synthetic environments only. Request and response bodies are defined by
    packages/contracts/src/synthetic-task.schema.json, which the service validates at runtime;
    this document references it instead of restating it. Tenant authority always comes from the
    verified bearer token and a live membership; no path, query, header or body field selects a
    tenant. Refusals use the shared Refusal body and the transport mapping in docs/SHARED-CONTRACTS.md.
    Hidden cross-tenant and missing resources return the same 404 body. Proposal bodies are defined
    by packages/contracts/src/action-proposal.schema.json. Scheduling resource and availability
    bodies (S7, S9) are defined by packages/contracts/src/scheduling.schema.json.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://127.0.0.1
    description: Local synthetic test server only
security:
  - bearer: []
paths:
  /healthz:
    get:
      operationId: health.read
      security: []
      responses:
        '200':
          description: Service is up. Body is exactly {"status":"ok"}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/session:
    get:
      operationId: session.read
      responses:
        '200':
          description: Server-derived context for the presented token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/synthetic-tasks:
    post:
      operationId: syntheticTasks.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/SyntheticTaskCreate'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/SyntheticTaskCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
    get:
      operationId: syntheticTasks.list
      parameters:
        - name: limit
          in: query
          required: false
          description: 1 to 100, default 25. Larger values are refused, not clamped.
          schema:
            $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/SyntheticTaskListQuery/properties/limit'
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/Cursor'
      responses:
        '200':
          description: One page of the caller's tenant tasks.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/SyntheticTaskList'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/synthetic-tasks/{taskRef}:
    get:
      operationId: syntheticTasks.read
      parameters:
        - $ref: '#/components/parameters/TaskRef'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/SyntheticTaskRead'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/synthetic-tasks/{taskRef}/relabel:
    post:
      operationId: syntheticTasks.relabel
      parameters:
        - $ref: '#/components/parameters/TaskRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/SyntheticTaskRelabel'
      responses:
        '200':
          description: Task relabelled; version incremented.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/SyntheticTaskCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/synthetic-tasks/proposals:
    post:
      operationId: syntheticTasks.proposals.prepare
      description: >-
        Prepare a server-owned proposal for a synthetic create or relabel. Binds tenant, operation,
        the payload and its canonical SHA-256 digest, the target task version (relabel), the policy
        version, the proposer and an expiry (15 min). Requires syntheticTasks.read only: preparing never
        changes a task and never enqueues anything.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalPrepare'
      responses:
        '201':
          description: Proposal prepared (state prepared).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/synthetic-tasks/proposals/{proposalRef}:
    get:
      operationId: syntheticTasks.proposals.read
      description: >-
        Read a proposal, including its payload. Visible only to its proposer, approver or committer and
        to members who could approve (human, syntheticTasks.approve) or execute it (syntheticTasks.write);
        everyone else, including other tenants, gets the same 404 as for a missing proposal. Read-only.
      parameters:
        - $ref: '#/components/parameters/ProposalRef'
      responses:
        '200':
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalRead'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/synthetic-tasks/proposals/{proposalRef}/approve:
    post:
      operationId: syntheticTasks.proposals.approve
      description: >-
        Approve a prepared proposal over the payloadDigest the approver reviewed. Human principals with
        syntheticTasks.approve only; a service principal approving its own proposal is refused with
        self_approval_denied. The idempotency key is the proposal id (no header). execution=deferred
        enqueues a durable execution request for the worker.
      parameters:
        - $ref: '#/components/parameters/ProposalRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalApprove'
      responses:
        '200':
          description: Proposal approved (or the same approver's earlier approval, replayed).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/synthetic-tasks/proposals/{proposalRef}/commit:
    post:
      operationId: syntheticTasks.proposals.commit
      description: >-
        Execute an approved proposal. The body repeats the payload; its digest must equal the bound one.
        Reauthorizes the executor for the operation and rechecks the proposer and approver memberships,
        the approval record, the policy version, the expiry and the task version. A refused commit that
        makes the proposal unusable closes it (expired or rejected). The idempotency key is the
        proposal id: a committed proposal returns its recorded result with replayed=true and never
        executes twice.
      parameters:
        - $ref: '#/components/parameters/ProposalRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalCommit'
      responses:
        '200':
          description: The synthetic mutation committed (or the recorded result, replayed).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/SyntheticTaskCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/scheduling/locations:
    post:
      operationId: scheduling.locations.define
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationDefine'
      responses:
        '201':
          description: Location defined with its IANA zone (admin.configure).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
    get:
      operationId: scheduling.locations.list
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Locations visible to the caller (scheduling.read), one bounded page.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationList'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/scheduling/locations/{locationRef}/time-zone:
    post:
      operationId: scheduling.locations.changeTimeZone
      parameters:
        - $ref: '#/components/parameters/SchedulingLocationRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationTimeZoneChange'
      responses:
        '200':
          description: Zone changed. Refused (409, conflict list) while the location has future occupied time.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/scheduling/resources:
    post:
      operationId: scheduling.resources.define
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceDefine'
      responses:
        '201':
          description: Resource defined (admin.configure). A label naming an appointment state is 422 reservedStateLabel.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
    get:
      operationId: scheduling.resources.list
      parameters:
        - $ref: '#/components/parameters/ResourceListLocation'
        - $ref: '#/components/parameters/ResourceListKind'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Resources visible to the caller (scheduling.read), one bounded page.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceList'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/scheduling/resources/{resourceRef}:
    get:
      operationId: scheduling.resources.read
      parameters:
        - $ref: '#/components/parameters/ResourceRef'
      responses:
        '200':
          description: One resource with every effective-dated availability version.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceRead'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/scheduling/resources/{resourceRef}/availability:
    post:
      operationId: scheduling.resources.setAvailability
      parameters:
        - $ref: '#/components/parameters/ResourceRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/AvailabilitySet'
      responses:
        '201':
          description: New availability version from effectiveFrom (append-only; an overlapping version is 409).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/AvailabilityCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/scheduling/resources/{resourceRef}/deactivate:
    post:
      operationId: scheduling.resources.deactivate
      parameters:
        - $ref: '#/components/parameters/ResourceRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceDeactivate'
      responses:
        '200':
          description: Resource deactivated. Refused (409, bookings enumerated) while it has future bookings or holds.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/scheduling/time-blocks:
    post:
      operationId: scheduling.timeBlocks.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/TimeBlockCreate'
      responses:
        '201':
          description: Unavailable time with a reason and no patient. Overlap with an occupant is 409 with the conflict list.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/TimeBlockCommandResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/scheduling/data-quality/state-labelled-resources:
    get:
      operationId: scheduling.resources.dataQuality
      responses:
        '200':
          description: Data-quality report of resources whose label resembles an appointment state (admin.configure).
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/StateLabelReport'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
  /v1/availability/search:
    post:
      operationId: scheduling.availability.search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/AvailabilitySearch'
      responses:
        '200':
          description: Advisory, read-only availability windows with applied constraints and a coverage statement.
          content:
            application/json:
              schema:
                $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/AvailabilitySearchResult'
        '400':
          $ref: '#/components/responses/Refusal'
        '401':
          $ref: '#/components/responses/Refusal'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
        '503':
          $ref: '#/components/responses/Refusal'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA; claims sub, tid, sid, iss, aud, exp, iat)
  parameters:
    TaskRef:
      name: taskRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/TaskRef'
    ProposalRef:
      name: proposalRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/action-proposal.schema.json#/$defs/ProposalRef'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-supplied key, scoped to (tenant, principal, operation) and retained 7 days. A retry with
        the same key and an identical body (canonical SHA-256 digest; key order ignored) returns the
        recorded result with replayed=true after re-authorizing the caller, or replays the recorded
        terminal refusal (for example stale_version). The same key with a different body (or another
        relabel target) is 409 idempotency_conflict. While the first request is still in flight a
        duplicate waits for it; a reservation left pending for more than 60 s is taken over. A
        corrected request needs a new key.
      schema:
        $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/IdempotencyKey'
    ResourceRef:
      name: resourceRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceRefId'
    SchedulingLocationRef:
      name: locationRef
      in: path
      required: true
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationRef'
    ResourceListLocation:
      name: locationRef
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/LocationRef'
    ResourceListKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/ResourceKind'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size 1-100 (default 25). Larger values are refused, not clamped.
      schema:
        type: string
        pattern: '^([1-9]|[1-9][0-9]|100)$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '../../packages/contracts/src/scheduling.schema.json#/$defs/Cursor'
  responses:
    Refusal:
      description: Typed refusal (code, retryable, correlationId, optional safe detail).
      content:
        application/json:
          schema:
            $ref: '../../packages/contracts/src/synthetic-task.schema.json#/$defs/Refusal'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    Session:
      type: object
      additionalProperties: false
      required: [tenantRef, principalRef, principal, scopes]
      properties:
        tenantRef:
          type: string
        principalRef:
          type: string
        principal:
          enum: [human, service]
        scopes:
          type: array
          items:
            type: string
